{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h1 class="text-center mb-4">
        Editar Proveedor
    </h1>

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="mb-0">
                Editar Proveedor
            </h2>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre del Proveedor
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ proveedor.nombre }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Correo
                    </label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control"
                        value="{{ proveedor.correo }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control"
                        value="{{ proveedor.telefono }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Estado
                    </label>

                    <select
                        name="estado"
                        class="form-select"
                        required
                    >

                        <option
                            value="Activo"
                            {% if proveedor.estado == "Activo" %}
                            selected
                            {% endif %}
                        >
                            Activo
                        </option>

                        <option
                            value="Inactivo"
                            {% if proveedor.estado == "Inactivo" %}
                            selected
                            {% endif %}
                        >
                            Inactivo
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Guardar Cambios
                </button>

                <a
                    href="/proveedores"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
